<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的點數背包</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f7f9fc;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { color: #2c3e50; }
        .card { 
            background: #fff;
            border: 2px solid #e1e8ed; 
            padding: 20px; 
            margin: 15px auto; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .points-num { font-size: 3em; color: #e74c3c; font-weight: bold; margin: 10px 0; }
        .history-list { text-align: left; max-height: 250px; overflow-y: auto; padding: 0; list-style: none; }
        .history-item { background: #fdfefe; border-bottom: 1px solid #eee; padding: 10px; font-size: 0.95em; }
        .history-time { font-size: 0.8em; color: #95a5a6; }
        .back-btn { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 10px 20px; 
            background: #3498db; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
        }
        .back-btn:hover { background: #2980b9; }
        #loading { font-size: 1.2em; color: #7f8c8d; margin-top: 40px; }
    </style>
</head>
<body>

    <h2 id="title">🎒 我的點數背包</h2>

    <div id="loading">正在載入您的點數資料...</div>

    <div id="content" style="display: none;">
        <div class="card">
            <p>目前擁有總點數</p>
            <div class="points-num" id="points-display">0</div>
        </div>

        <div class="card">
            <h3>📜 近期點數異動紀錄</h3>
            <ul class="history-list" id="history-list"></ul>
        </div>
    </div>

    <a href="index.html" class="back-btn">返回首頁 / 繼續掃描</a>

    <script>
        // ⚠️ 請把這裡換成你的 Google Apps Script 網頁應用程式網址
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOqzf7Z5bVOCgmgrdhB2LYN8If4i4ZU-M-MoSuWpyWlH2crfllm6xROvrcQnvjtycr/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get("id");

        if (!studentId) {
            document.getElementById("loading").innerText = "❌ 找不到學生代號，請重新掃描！";
        } else {
            document.getElementById("title").innerText = `🎒 座號 ${studentId} 的個人背包`;
            fetchStudentData(studentId);
        }

        function fetchStudentData(id) {
            fetch(`${WEB_APP_URL}?id=${id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        document.getElementById("points-display").innerText = data.points;
                        
                        let historyHtml = "";
                        if (data.history.length === 0) {
                            historyHtml = "<li class='history-item' style='text-align: center; color: #999;'>目前還沒有交易紀錄喔！</li>";
                        } else {
                            data.history.forEach(item => {
                                historyHtml += `
                                    <li class="history-item">
                                        <div><b>${item.action}</b> <span style="float: right; color: ${item.change.startsWith('+') ? '#27ae60' : '#e74c3c'};">${item.change} 點</span></div>
                                        <div class="history-time">${item.time} (剩餘: ${item.balance} 點)</div>
                                    </li>
                                `;
                            });
                        }
                        document.getElementById("history-list").innerHTML = historyHtml;

                        document.getElementById("loading").style.display = "none";
                        document.getElementById("content").style.display = "block";
                    } else {
                        document.getElementById("loading").innerText = `❌ 讀取失敗: ${data.message}`;
                    }
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("loading").innerText = "❌ 網路連線錯誤，請稍後再試。";
                });
        }
    </script>
</body>
</html>
