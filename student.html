<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班級點數福利社</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <script>
    // ==========================================
    // 請在這裡確認已填入您的 Google Apps Script 網址
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxDkVgD5UO4W7pW8PgGyzr2KBgvD6lREMSCIHVAHaAJeQGuxdedC3Th1txCSz-wvhaA/exec";
  </script>

  <div class="container" style="max-width: 600px;">
    
    <!-- 首頁 -->
    <div id="view-home" class="card p-4 text-center mt-5" style="display:none;">
      <h2 class="mb-4 text-primary">🏫 班級點數福利社系統</h2>
      <div class="d-grid gap-3 col-8 mx-auto">
        <button class="btn btn-danger btn-lg" onclick="checkPassword()">進入老師端</button>
        <button class="btn btn-success btn-lg" onclick="switchView('student_login')">進入學生端</button>
      </div>
    </div>

    <!-- 老師端 -->
    <div id="view-teacher" class="card p-4 mt-3" style="display:none;">
      <h3 class="text-danger mb-3">🛠️ 老師端管理面板</h3>
      <div class="mb-3">
        <label class="form-label">選擇動作：</label>
        <select id="actionType" class="form-select">
          <option value="add">加分</option>
          <option value="sub">扣分</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">點數：</label>
        <input type="number" id="points" class="form-control" value="10">
      </div>
      <div class="mb-3">
        <label class="form-label">原因 / 項目說明：</label>
        <input type="text" id="reason" class="form-control" placeholder="例如：課堂表現良好 / 遲到">
      </div>
      <hr>
      <h5 class="text-center">請掃描學生的學生卡 (student:座號)</h5>
      <div id="teacher-reader" style="width: 100%;" class="mb-3"></div>
      <div id="teacher-result" class="alert alert-info text-center" style="display:none;"></div>
      <button class="btn btn-secondary w-100 mt-2" onclick="switchView('home')">返回首頁</button>
    </div>

    <!-- 學生登入選擇 -->
    <div id="view-student_login" class="card p-4 mt-3 text-center" style="display:none;">
      <h3 class="text-success mb-3">👨‍🎓 學生端登入</h3>
      <p>請掃描您的學生卡進行登入：</p>
      <div id="student-login-reader" style="width: 100%;" class="mb-3"></div>
      <button class="btn btn-secondary w-100" onclick="switchView('home')">返回首頁</button>
    </div>

    <!-- 學生個人儀表板與購物 -->
    <div id="view-student_dashboard" class="card p-4 mt-3 text-center" style="display:none;">
      <h3 class="text-success mb-2">🎒 學生專區 (座號：<span id="currentStudentId"></span>)</h3>
      <div class="alert alert-warning text-center fs-4">
        現有點數：<span id="myBalance" class="fw-bold">載入中...</span> 點
      </div>
      
      <hr>
      
      <!-- 點數載入完成前隱藏，完成後才出現的按鈕 -->
      <div id="shop-trigger-container" style="display: none;">
        <p class="text-muted">準備好了嗎？請點擊下方按鈕開始掃描商品</p>
        <button class="btn btn-primary btn-lg w-100 mb-3" onclick="openShopScanner()">📷 掃描福利社商品</button>
      </div>

      <!-- 掃描器外框（預設隱藏，點擊按鈕後才展開） -->
      <div id="scanner-wrapper" style="display: none;">
        <h5 class="text-center">請對準「福利社商品卡」</h5>
        <div id="student-shop-reader" style="width: 100%;" class="mb-3"></div>
      </div>

      <!-- 交易處理中的載入提示 -->
      <div id="loading-overlay" class="alert alert-info text-center fs-5" style="display: none;">
        ⏳ <strong>交易處理中，請稍候...</strong><br>請勿退出或重新整理網頁！
      </div>

      <div id="shop-result" class="alert text-center" style="display:none;"></div>
      
      <button class="btn btn-outline-secondary w-100 mt-2" onclick="switchView('student_login')">重新登入 / 切換學生</button>
    </div>

  </div>

  <script>
    let activeStudentId = '';
    let teacherScanner = null;
    let loginScanner = null;
    let shopScanner = null;

    function switchView(mode, param) {
      stopAllScanners();

      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-teacher').style.display = 'none';
      document.getElementById('view-student_login').style.display = 'none';
      document.getElementById('view-student_dashboard').style.display = 'none';

      if (mode === 'home') {
        document.getElementById('view-home').style.display = 'block';
      } else if (mode === 'teacher') {
        document.getElementById('view-teacher').style.display = 'block';
        initTeacherScanner();
      } else if (mode === 'student_login') {
        document.getElementById('view-student_login').style.display = 'block';
        initLoginScanner();
      } else if (mode === 'student_dashboard') {
        activeStudentId = param;
        document.getElementById('currentStudentId').innerText = activeStudentId;
        document.getElementById('view-student_dashboard').style.display = 'block';
        loadBalance(activeStudentId);
      }
    }

    function stopAllScanners() {
      try { if (teacherScanner) teacherScanner.clear(); } catch(e){}
      try { if (loginScanner) loginScanner.clear(); } catch(e){}
      try { if (shopScanner) shopScanner.clear(); } catch(e){}
    }

    window.onload = function() {
      switchView('home');
    };

    function checkPassword() {
      let pwd = prompt("請輸入老師端管理密碼：");
      if (pwd === "0000") {
        switchView('teacher');
      } else if (pwd !== null) {
        alert("密碼錯誤！");
      }
    }

    function loadBalance(studentId) {
      document.getElementById('myBalance').innerText = "載入中...";
      document.getElementById('shop-trigger-container').style.display = 'none';
      document.getElementById('scanner-wrapper').style.display = 'none';
      document.getElementById('shop-result').style.display = 'none';
      
      fetch(`${GAS_URL}?action=getAllStudentsBalance`)
        .then(res => res.json())
        .then(balances => {
          let b = balances[studentId] !== undefined ? balances[studentId] : 0;
          document.getElementById('myBalance').innerText = b;
          document.getElementById('shop-trigger-container').style.display = 'block';
        })
        .catch(err => {
          console.error(err);
          document.getElementById('myBalance').innerText = "讀取失敗";
          alert("點數載入失敗，請重新登入");
        });
    }

    function openShopScanner() {
      document.getElementById('shop-trigger-container').style.display = 'none';
      document.getElementById('scanner-wrapper').style.display = 'block';
      document.getElementById('shop-result').style.display = 'none';
      initShopScanner();
    }

    function initTeacherScanner() {
      document.getElementById('teacher-result').style.display = 'none';
      teacherScanner = new Html5QrcodeScanner("teacher-reader", { fps: 10, qrbox: 250 });
      teacherScanner.render((decodedText) => {
        teacherScanner.clear();
        if (decodedText.startsWith("student:")) {
          let studentId = decodedText.split(":")[1];
          let actionType = document.getElementById('actionType').value;
          let points = document.getElementById('points').value;
          let reason = document.getElementById('reason').value || '老師調整';

          let formData = new URLSearchParams();
          formData.append('action', 'teacherAction');
          formData.append('studentId', studentId);
          formData.append('actionType', actionType);
          formData.append('points', points);
          formData.append('reason', reason);

          fetch(GAS_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
              let resDiv = document.getElementById('teacher-result');
              resDiv.style.display = 'block';
              if(res.success) {
                resDiv.className = "alert alert-success text-center";
                resDiv.innerHTML = "成功！座號 " + studentId + " 點數已更新。目前餘額：" + res.newBalance;
              } else {
                resDiv.className = "alert alert-danger text-center";
                resDiv.innerHTML = res.message;
              }
              setTimeout(initTeacherScanner, 3000);
            });
        } else {
          alert("無效的學生卡 QrCode：" + decodedText);
          initTeacherScanner();
        }
      }, ()=>{});
    }

    function initLoginScanner() {
      loginScanner = new Html5QrcodeScanner("student-login-reader", { fps: 10, qrbox: 250 });
      loginScanner.render((decodedText) => {
        if (decodedText.startsWith("student:")) {
          let studentId = decodedText.split(":")[1];
          switchView('student_dashboard', studentId);
        } else {
          alert("這不是有效的學生個人卡！");
        }
      }, ()=>{});
    }

    function initShopScanner() {
      shopScanner = new Html5QrcodeScanner("student-shop-reader", { fps: 10, qrbox: 250 });
      shopScanner.render((decodedText) => {
        shopScanner.clear();
        document.getElementById('scanner-wrapper').style.display = 'none';
        
        if (decodedText.startsWith("ITEM:")) {
          let parts = decodedText.split(":");
          let itemName = parts[1];
          let itemPrice = parts[2];

          if(!itemName || !itemPrice) {
            alert("商品卡格式錯誤！");
            document.getElementById('shop-trigger-container').style.display = 'block';
            return;
          }

          let confirmBuy = confirm(`【確認購買】\n\n您確定要花費 ${itemPrice} 點購買「${itemName}」嗎？`);

          if (!confirmBuy) {
            alert("已取消購買。");
            document.getElementById('shop-trigger-container').style.display = 'block';
            return;
          }

          document.getElementById('loading-overlay').style.display = 'block';

          let formData = new URLSearchParams();
          formData.append('action', 'studentCheckout');
          formData.append('studentId', activeStudentId);
          formData.append('itemName', itemName);
          formData.append('itemPrice', itemPrice);

          fetch(GAS_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
              document.getElementById('loading-overlay').style.display = 'none';
              
              let resDiv = document.getElementById('shop-result');
              resDiv.style.display = 'block';
              if(res.success) {
                resDiv.className = "alert alert-success text-center fs-5";
                resDiv.innerHTML = "🎉 " + res.message + "<br>剩餘點數：" + res.newBalance;
                document.getElementById('myBalance').innerText = res.newBalance;
              } else {
                resDiv.className = "alert alert-danger text-center fs-5";
                resDiv.innerHTML = "❌ " + res.message;
              }
              
              setTimeout(() => {
                resDiv.style.display = 'none';
                document.getElementById('shop-trigger-container').style.display = 'block';
              }, 4000);
            })
            .catch(err => {
              console.error(err);
              document.getElementById('loading-overlay').style.display = 'none';
              alert("連線發生錯誤，請重試");
              document.getElementById('shop-trigger-container').style.display = 'block';
            });

        } else {
          alert("這不是有效的商品卡片！");
          document.getElementById('shop-trigger-container').style.display = 'block';
        }
      }, ()=>{});
    }
  </script>
</body>
</html>
