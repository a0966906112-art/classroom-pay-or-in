<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級點數福利社系統 - 老師端</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f7f9fc; color: #333; max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 2px solid #e1e8ed; padding: 25px; margin: 15px auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn { background-color: #3498db; color: white; border: none; padding: 15px 25px; font-size: 1.2em; border-radius: 10px; cursor: pointer; margin: 10px; font-weight: bold; width: 80%; }
        .btn-success { background-color: #2ecc71; }
        .btn-danger { background-color: #e74c3c; }
        .btn-warning { background-color: #f39c12; color: white; }
        input[type="password"], input[type="number"] { width: 80%; padding: 12px; font-size: 1.2em; text-align: center; border: 2px solid #bdc3c7; border-radius: 8px; margin: 10px 0; }
        #teacher-reader { width: 100%; max-width: 300px; margin: 0 auto; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .highlight { color: #e74c3c; font-weight: bold; font-size: 1.2em; }
        #teacher-status-msg { font-size: 1.1em; font-weight: bold; color: #2980b9; margin-top: 15px; }
        .section-view { display: none; }
    </style>
</head>
<body>

    <h2>👩‍🏫 班級點數福利社 - 老師管理後台</h2>

    <!-- 1. 密碼登入 -->
    <div id="view-teacher-login" class="card">
        <h3>請輸入管理密碼</h3>
        <input type="password" id="teacher-pwd" placeholder="預設密碼 1234"><br>
        <button class="btn btn-success" style="width: auto; padding: 10px 25px;" onclick="verifyTeacherPwd()">登入後台</button>
    </div>

    <!-- 2. 管理後台主畫面 -->
    <div id="view-teacher-dashboard" class="section-view card">
        <div style="margin-bottom: 15px;">
            <button class="btn" style="width: 45%; padding: 10px;" onclick="switchTeacherTab('points')">➕ 老師加減分</button>
            <button class="btn" style="width: 45%; padding: 10px;" onclick="switchTeacherTab('shop')">🏷️ 商品結帳台</button>
        </div>

        <div id="teacher-panel-points" class="card" style="padding: 15px;">
            <h4>設定點數變動</h4>
            <div>
                <label><input type="radio" name="mode" value="add" checked onclick="setActionType('add')"> ➕ 加分</label>
                <label style="margin-left: 15px;"><input type="radio" name="mode" value="minus" onclick="setActionType('minus')"> ➖ 扣分</label>
            </div>
            <div style="margin: 10px 0;">
                <span>數值：</span><input type="number" id="points-input" value="5" min="1" max="100" style="width: 80px; padding: 5px;"> 分
            </div>
            <button class="btn btn-success" style="width: auto; padding: 8px 15px;" onclick="lockPointsAction()">鎖定分數，準備掃學生卡</button>
        </div>

        <div id="teacher-panel-shop" class="card" style="padding: 15px; display: none;">
            <h4>福利社商品結帳</h4>
            <p>目前商品：<span id="selected-item" class="highlight">尚未掃描商品卡</span> (售價: <span id="item-price">0</span>點)</p>
        </div>

        <div class="card" style="padding: 15px;">
            <h4 id="teacher-scan-title">相機掃描區</h4>
            <div id="teacher-reader"></div>
            <p id="teacher-status-msg">請先完成上方設定或選擇模式...</p>
            <button class="btn btn-danger" id="teacher-reset-btn" style="display: none; width: auto; padding: 8px 15px;" onclick="resetTeacherState()">重新設定</button>
        </div>

        <button class="btn btn-danger" style="margin-top: 15px;" onclick="location.reload()">登出後台</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztcPAltvBw-gAN3ivRfDzsM5aCdZlOgS70-yANzUR9-B6qS-zShsWUDVsymPlamXVu/exec";
        const TEACHER_PASSWORD = "1234";

        let teacherScanner = null;
        let currentTeacherMode = "points", actionType = "add", targetPoints = 5;
        let currentItem = null, currentPrice = 0, isProcessing = false;

        function verifyTeacherPwd() {
            if (document.getElementById('teacher-pwd').value === TEACHER_PASSWORD) {
                document.getElementById('view-teacher-login').style.display = 'none';
                document.getElementById('view-teacher-dashboard').style.display = 'block';
                initTeacherScanner();
            } else { alert("❌ 密碼錯誤！"); }
        }

        function switchTeacherTab(mode) {
            currentTeacherMode = mode;
            resetTeacherState();
            if (mode === "points") {
                document.getElementById('teacher-panel-points').style.display = 'block';
                document.getElementById('teacher-panel-shop').style.display = 'none';
                document.getElementById('teacher-scan-title').innerText = "相機掃描區（準備掃學生卡加減分）";
            } else {
                document.getElementById('teacher-panel-points').style.display = 'none';
                document.getElementById('teacher-panel-shop').style.display = 'block';
                document.getElementById('teacher-scan-title').innerText = "相機掃描區（請先掃商品卡，再掃學生卡）";
            }
        }

        function setActionType(type) { actionType = type; }

        function lockPointsAction() {
            let val = parseInt(document.getElementById("points-input").value, 10);
            if (isNaN(val) || val <= 0) { alert("請輸入有效分數！"); return; }
            targetPoints = val;
            let actionText = (actionType === "add") ? `加 ${targetPoints} 分` : `扣 ${targetPoints} 分`;
            document.getElementById("teacher-status-msg").innerText = `已鎖定：【${actionText}】，請拿學生卡來掃描！`;
            document.getElementById("teacher-reset-btn").style.display = "inline-block";
        }

        function initTeacherScanner() {
            if (!teacherScanner) { teacherScanner = new Html5Qrcode("teacher-reader"); }
            teacherScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                onTeacherScanSuccess,
                (err) => {}
            ).catch(err => { alert("無法啟動相機！"); });
        }

        function onTeacherScanSuccess(decodedText) {
            if (isProcessing) return;
            decodedText = decodedText.trim();

            if (currentTeacherMode === "shop" && decodedText.startsWith("ITEM:")) {
                let parts = decodedText.split(":");
                currentItem = parts[1];
                currentPrice = parseInt(parts[2], 10);
                document.getElementById("selected-item").innerText = currentItem;
                document.getElementById("item-price").innerText = currentPrice;
                document.getElementById("teacher-status-msg").innerText = `已選擇「${currentItem}」(${currentPrice}點)，請接著掃描學生卡結帳！`;
                document.getElementById("teacher-reset-btn").style.display = "inline-block";
                return;
            }

            let studentId = decodedText; // 直接抓取純座號 (例如 "01" 或 "1")
            if (currentTeacherMode === "points") {
                isProcessing = true;
                let actualPoints = (actionType === "add") ? targetPoints : -targetPoints;
                document.getElementById("teacher-status-msg").innerText = `正在為座號 ${studentId} 執行點數變動...`;
                sendDataToSheet({ action: "add", studentId: studentId, points: actualPoints }, `✨ 成功！已為座號 ${studentId} 執行變動。`);
            } else if (currentTeacherMode === "shop" && currentItem) {
                isProcessing = true;
                document.getElementById("teacher-status-msg").innerText = `正在檢查座號 ${studentId} 點數並結帳...`;
                fetch(`${WEB_APP_URL}?id=${studentId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "success") {
                            if (data.points >= currentPrice) {
                                sendDataToSheet({ action: "buy", studentId: studentId, item: currentItem, price: currentPrice }, `🎉 結帳成功！座號 ${studentId} 買了「${currentItem}」。`);
                            } else {
                                alert(`❌ 點數不足！座號 ${studentId} 目前只有 ${data.points} 點。`);
                                isProcessing = false;
                            }
                        } else { alert("找不到該學生座號分頁。"); isProcessing = false; }
                    })
                    .catch(err => { alert("連線發生錯誤。"); isProcessing = false; });
            }
        }

        function resetTeacherState() {
            isProcessing = false;
            currentItem = null;
            currentPrice = 0;
            document.getElementById("selected-item").innerText = "尚未掃描商品卡";
            document.getElementById("item-price").innerText = "0";
            document.getElementById("teacher-reset-btn").style.display = "none";
            document.getElementById("teacher-status-msg").innerText = "請依照上方模式進行操作...";
        }

        function sendDataToSheet(payload, successMsg) {
            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") { alert(successMsg); }
                else { alert("操作失敗: " + data.message); }
                resetTeacherState();
            })
            .catch(error => { alert("交易連線發生錯誤。"); resetTeacherState(); });
        }
    </script>
</body>
</html>
