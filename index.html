<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級點數福利社與加分台</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f7f9fc;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { color: #2c3e50; }
        #reader { 
            width: 100%; 
            max-width: 320px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .box { 
            background: #fff;
            border: 2px solid #e1e8ed; 
            padding: 15px; 
            margin: 15px auto; 
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .highlight { color: #e74c3c; font-weight: bold; font-size: 1.3em; }
        #status-msg { font-size: 1.1em; font-weight: bold; color: #2980b9; margin-top: 15px; }
        .hint-text { font-size: 0.9em; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🛒 班級點數福利社與加分台</h2>
    
    <div class="box">
        <p>目前選擇動作 / 商品：<br><span id="selected-item" class="highlight">尚未選擇</span></p>
        <p>數值 / 點數：<span id="item-price" class="highlight">0</span></p>
    </div>

    <div id="reader"></div>
    <p id="status-msg">請先掃描「加分卡」、「商品卡」；或直接掃描學生卡開啟背包！</p>
    <p class="hint-text">（使用手機或平板鏡頭對準 QR Code 即可自動感應）</p>

    <script>
        // ⚠️ 請把這裡換成你的 Google Apps Script 網頁應用程式網址
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOqzf7Z5bVOCgmgrdhB2LYN8If4i4ZU-M-MoSuWpyWlH2crfllm6xROvrcQnvjtycr/exec";
        const STUDENT_PAGE_BASE_URL = "student.html"; 

        let currentItem = null;        
        let currentPrice = 0;          
        let currentPointsToAdd = 0;    
        let isProcessing = false;      

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; 
            console.log(`掃描結果: ${decodedText}`);

            if (decodedText.startsWith("POINT:")) {
                let parts = decodedText.split(":");
                currentPointsToAdd = parseInt(parts[1], 10);
                currentItem = null; 
                currentPrice = 0;
                
                document.getElementById("selected-item").innerText = `加分：+${currentPointsToAdd} 點`;
                document.getElementById("item-price").innerText = `+${currentPointsToAdd}`;
                document.getElementById("status-msg").innerText = `已選擇「+${currentPointsToAdd}點」，請接著掃描「學生個人卡」！`;
                triggerFeedback();

            } else if (decodedText.startsWith("ITEM:")) {
                let parts = decodedText.split(":");
                currentItem = parts[1];
                currentPrice = parseInt(parts[2], 10);
                currentPointsToAdd = 0; 
                
                document.getElementById("selected-item").innerText = currentItem;
                document.getElementById("item-price").innerText = currentPrice;
                document.getElementById("status-msg").innerText = `已選擇「${currentItem}」，請接著掃描「學生個人卡」！`;
                triggerFeedback();

            } else if (decodedText.startsWith("student:")) {
                let studentId = decodedText.split(":")[1];
                
                if (currentPointsToAdd > 0) {
                    isProcessing = true;
                    document.getElementById("status-msg").innerText = `正在為座號 ${studentId} 增加 ${currentPointsToAdd} 點...`;
                    sendDataToSheet({ action: "add", studentId: studentId, points: currentPointsToAdd }, `✨ 成功！已為座號 ${studentId} 增加 ${currentPointsToAdd} 點。`);
                    
                } else if (currentItem) {
                    isProcessing = true;
                    document.getElementById("status-msg").innerText = `正在檢查座號 ${studentId} 的點數是否足夠...`;
                    
                    // 購買前先向試算表查詢該學生點數，確保夠錢才扣款
                    fetch(`${WEB_APP_URL}?id=${studentId}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === "success") {
                                if (data.points >= currentPrice) {
                                    // 點數足夠，執行扣款
                                    sendDataToSheet({ action: "buy", studentId: studentId, item: currentItem, price: currentPrice }, `🎉 結帳成功！座號 ${studentId} 成功購買「${currentItem}」，扣除 ${currentPrice} 點。`);
                                } else {
                                    // 點數不足，攔截！
                                    alert(`❌ 點數不足！座號 ${studentId} 目前只有 ${data.points} 點，無法購買 ${currentItem}（需 ${currentPrice} 點）。`);
                                    resetState();
                                }
                            } else {
                                alert("讀取學生點數失敗，請再試一次。");
                                resetState();
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            alert("連線發生錯誤，請再試一次。");
                            resetState();
                        });
                    
                } else {
                    document.getElementById("status-msg").innerText = `正在開啟座號 ${studentId} 的背包...`;
                    window.location.href = `${STUDENT_PAGE_BASE_URL}?id=${studentId}`;
                }
            }
        }

        function triggerFeedback() {
            if (navigator.vibrate) { navigator.vibrate(200); }
        }

        function resetState() {
            currentItem = null;
            currentPrice = 0;
            currentPointsToAdd = 0;
            isProcessing = false;
            document.getElementById("selected-item").innerText = "尚未選擇";
            document.getElementById("item-price").innerText = "0";
            document.getElementById("status-msg").innerText = "請先掃描「加分卡」、「商品卡」；或直接掃描學生卡開啟背包！";
        }

        function sendDataToSheet(payload, successMessage) {
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(successMessage);
                resetState();
            })
            .catch(error => {
                alert("交易連線發生錯誤，請檢查試算表。");
                console.error(error);
                resetState();
            });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, false);
        html5QrcodeScanner.render(onScanSuccess, (errorMessage) => {});
    </script>
</body>
</html>
